<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonjour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #fff0f3, #ffd6e0, #ffb3c6, #ffd6e0, #fff0f3);
      background-size: 400% 400%;
      animation: gradientShift 10s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: none;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* ===== CURSOR GLOW ===== */
    .cursor-glow {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 105, 135, 0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 50;
      transform: translate(-50%, -50%);
      will-change: left, top;
    }

    /* ===== SPARK TRAIL ===== */
    .cursor-spark {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      border-radius: 50%;
      background: radial-gradient(circle, #fff, #ff6b8a);
      box-shadow: 0 0 6px 1px rgba(255, 107, 138, 0.4);
      animation: sparkFade 0.7s ease-out forwards;
    }

    @keyframes sparkFade {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0) translateY(-15px); }
    }

    /* ===== PARTICLES CANVAS ===== */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ===== SPARKLES ===== */
    .sparkle-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 4px 1px rgba(255, 255, 255, 0.6);
      animation: twinkle var(--dur) ease-in-out infinite;
      opacity: 0;
    }

    .sparkle.pink {
      background: #ff8fab;
      box-shadow: 0 0 4px 1px rgba(255, 143, 171, 0.5);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.2); }
      50% { opacity: 0.9; transform: scale(1); }
    }

    /* ===== MAIN CONTENT ===== */
    .content {
      text-align: center;
      z-index: 10;
      position: relative;
    }

    .greeting-wrapper {
      position: relative;
      display: inline-block;
    }

    /* ===== GLOW RING ===== */
    .glow-ring {
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 105, 135, 0.1) 0%, transparent 65%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulseRing 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulseRing {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
    }

    /* ===== BONJOUR TEXT ===== */
    .greeting {
      font-family: 'Playfair Display', serif;
      font-size: clamp(4rem, 13vw, 9rem);
      font-weight: 700;
      color: #c2185b;
      filter: drop-shadow(0 4px 30px rgba(194, 24, 91, 0.25));
      letter-spacing: 3px;
      position: relative;
    }

    .greeting .letter {
      display: inline-block;
      opacity: 0;
      animation: letterPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .greeting .letter:nth-child(1) { animation-delay: 0.2s; }
    .greeting .letter:nth-child(2) { animation-delay: 0.35s; }
    .greeting .letter:nth-child(3) { animation-delay: 0.5s; }
    .greeting .letter:nth-child(4) { animation-delay: 0.65s; }
    .greeting .letter:nth-child(5) { animation-delay: 0.8s; }
    .greeting .letter:nth-child(6) { animation-delay: 0.95s; }
    .greeting .letter:nth-child(7) { animation-delay: 1.1s; }

    @keyframes letterPop {
      0% {
        opacity: 0;
        transform: translateY(25px) scale(0.6) rotate(-8deg);
      }
      70% {
        transform: translateY(-4px) scale(1.08) rotate(1deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0deg);
      }
    }

    /* ===== HEARTS ROW ===== */
    .hearts-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 16px;
      opacity: 0;
      animation: fadeInUp 0.7s 1.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    .mini-heart {
      font-size: 2.2rem;
      display: inline-block;
      animation: heartPulse 1.6s ease-in-out infinite;
      cursor: none;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
    }

    .mini-heart:hover {
      transform: scale(1.8) rotate(15deg) !important;
      filter: drop-shadow(0 0 14px rgba(255, 105, 135, 0.6));
    }

    .mini-heart:nth-child(1) { animation-delay: 0s; }
    .mini-heart:nth-child(2) { animation-delay: 0.15s; }
    .mini-heart:nth-child(3) { animation-delay: 0.3s; }
    .mini-heart:nth-child(4) { animation-delay: 0.15s; }
    .mini-heart:nth-child(5) { animation-delay: 0s; }

    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      20% { transform: scale(1.25); }
      40% { transform: scale(1); }
      55% { transform: scale(1.15); }
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== CLICK BURST ===== */
    .click-heart {
      position: fixed;
      pointer-events: none;
      z-index: 200;
      animation: floatUp 1.1s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-180px) scale(0.2) rotate(var(--rot));
      }
    }

    /* ===== MOBILE ===== */
    @media (hover: none) {
      body { cursor: auto; }
      .cursor-glow { display: none; }
      .mini-heart { cursor: pointer; }
    }
  </style>
</head>
<body>

  <div class="cursor-glow" id="cursorGlow"></div>
  <canvas id="particles"></canvas>
  <div class="sparkle-container" id="sparkles"></div>

  <div class="content">
    <div class="greeting-wrapper">
      <div class="glow-ring"></div>
      <div class="greeting">
        <span class="letter">B</span><span class="letter">o</span><span class="letter">n</span><span class="letter">j</span><span class="letter">o</span><span class="letter">u</span><span class="letter">r</span>
      </div>
    </div>

    <div class="hearts-row">
      <span class="mini-heart">💗</span>
      <span class="letter-space"></span>
      <span class="mini-heart">💖</span>
      <span class="letter-space"></span>
      <span class="mini-heart">💕</span>
      <span class="letter-space"></span>
      <span class="mini-heart">💖</span>
      <span class="letter-space"></span>
      <span class="mini-heart">💗</span>
    </div>
  </div>

  <script>
    // ===== CURSOR GLOW =====
    const cursorGlow = document.getElementById('cursorGlow');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let glowX = mouseX;
    let glowY = mouseY;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function updateGlow() {
      glowX += (mouseX - glowX) * 0.1;
      glowY += (mouseY - glowY) * 0.1;
      cursorGlow.style.left = glowX + 'px';
      cursorGlow.style.top = glowY + 'px';
      requestAnimationFrame(updateGlow);
    }
    updateGlow();

    // ===== SPARK TRAIL =====
    let frameCount = 0;
    document.addEventListener('mousemove', (e) => {
      frameCount++;
      if (frameCount % 4 !== 0) return;
      const spark = document.createElement('div');
      spark.className = 'cursor-spark';
      const size = 3 + Math.random() * 4;
      spark.style.width = size + 'px';
      spark.style.height = size + 'px';
      spark.style.left = (e.clientX + (Math.random() - 0.5) * 12) + 'px';
      spark.style.top = (e.clientY + (Math.random() - 0.5) * 12) + 'px';
      document.body.appendChild(spark);
      spark.addEventListener('animationend', () => spark.remove());
    });

    // ===== 3D TILT =====
    const wrapper = document.querySelector('.greeting-wrapper');
    document.addEventListener('mousemove', (e) => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const dx = (e.clientX - cx) / cx;
      const dy = (e.clientY - cy) / cy;
      wrapper.style.transform = `perspective(600px) rotateX(${dy * -5}deg) rotateY(${dx * 6}deg)`;
    });

    // ===== CANVAS PARTICLES =====
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const HEARTS = [];
    const PETALS = [];
    const heartSymbols = ['♥', '♡', '❤', '💗', '💖'];
    const petalSymbols = ['🌸', '🌷', '✿', '❀'];

    function makeParticle(type, init) {
      return {
        type: type,
        x: Math.random() * W,
        y: init
          ? Math.random() * H
          : (type === 'heart' ? H + 30 : -30),
        size: type === 'heart'
          ? 16 + Math.random() * 14
          : 18 + Math.random() * 14,
        speedY: type === 'heart'
          ? -(0.15 + Math.random() * 0.45)
          : (0.12 + Math.random() * 0.35),
        speedX: (Math.random() - 0.5) * 0.3,
        opacity: 0.2 + Math.random() * 0.35,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.006 + Math.random() * 0.012,
        wobbleAmp: 0.25 + Math.random() * 0.35,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 0.6,
        symbol: type === 'heart'
          ? heartSymbols[Math.floor(Math.random() * heartSymbols.length)]
          : petalSymbols[Math.floor(Math.random() * petalSymbols.length)]
      };
    }

    for (let i = 0; i < 20; i++) HEARTS.push(makeParticle('heart', true));
    for (let i = 0; i < 15; i++) PETALS.push(makeParticle('petal', true));

    function updateP(p) {
      p.wobble += p.wobbleSpeed;
      p.x += p.speedX + Math.sin(p.wobble) * p.wobbleAmp;
      p.y += p.speedY;
      p.rotation += p.rotSpeed;

      if (p.type === 'heart' && p.y < -40) {
        Object.assign(p, makeParticle('heart', false));
      }
      if (p.type === 'petal' && p.y > H + 40) {
        Object.assign(p, makeParticle('petal', false));
      }
    }

    function drawP(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.globalAlpha = p.opacity;
      ctx.font = p.size + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.symbol, 0, 0);
      ctx.restore();
    }

    function loop() {
      ctx.clearRect(0, 0, W, H);
      HEARTS.forEach(p => { updateP(p); drawP(p); });
      PETALS.forEach(p => { updateP(p); drawP(p); });
      requestAnimationFrame(loop);
    }
    loop();

    // ===== SPARKLES =====
    const sparkleBox = document.getElementById('sparkles');
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle' + (Math.random() > 0.6 ? ' pink' : '');
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.setProperty('--dur', (1.5 + Math.random() * 3) + 's');
      s.style.animationDelay = (Math.random() * 4) + 's';
      const sz = 2 + Math.random() * 4;
      s.style.width = sz + 'px';
      s.style.height = sz + 'px';
      sparkleBox.appendChild(s);
    }

    // ===== CLICK BURST =====
    const burstSyms = ['💗', '💖', '💕', '✨', '🤍', '🩷'];
    document.addEventListener('click', (e) => {
      for (let i = 0; i < 8; i++) {
        const span = document.createElement('span');
        span.className = 'click-heart';
        span.textContent = burstSyms[Math.floor(Math.random() * burstSyms.length)];
        span.style.left = (e.clientX + (Math.random() - 0.5) * 80) + 'px';
        span.style.top = (e.clientY + (Math.random() - 0.5) * 60) + 'px';
        span.style.fontSize = (1 + Math.random() * 1) + 'rem';
        span.style.setProperty('--rot', (Math.random() * 50 - 25) + 'deg');
        span.style.animationDuration = (0.7 + Math.random() * 0.7) + 's';
        document.body.appendChild(span);
        span.addEventListener('animationend', () => span.remove());
      }
    });
  </script>
</body>
</html>
