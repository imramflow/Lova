<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonjour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: none;
    }

    /* ===== MESH GRADIENT BG ===== */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 600px 600px at 20% 30%, rgba(139, 92, 246, 0.12) 0%, transparent 70%),
        radial-gradient(ellipse 500px 500px at 80% 60%, rgba(236, 72, 153, 0.10) 0%, transparent 70%),
        radial-gradient(ellipse 700px 400px at 50% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 70%),
        #0a0a0f;
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: orbFloat var(--dur) ease-in-out infinite alternate;
    }

    .bg-orb--1 {
      width: 400px; height: 400px;
      background: rgba(168, 85, 247, 0.12);
      top: 10%; left: 15%;
      --dur: 12s;
    }

    .bg-orb--2 {
      width: 350px; height: 350px;
      background: rgba(236, 72, 153, 0.10);
      bottom: 15%; right: 10%;
      --dur: 15s;
      animation-delay: -4s;
    }

    .bg-orb--3 {
      width: 300px; height: 300px;
      background: rgba(59, 130, 246, 0.08);
      top: 60%; left: 50%;
      --dur: 18s;
      animation-delay: -8s;
    }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(var(--dx), var(--dy)) scale(var(--sc)); }
    }

    /* ===== NOISE OVERLAY ===== */
    .noise {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.03;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 200px;
    }

    /* ===== PARTICLES ===== */
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* ===== SPARKLES ===== */
    .sparkle-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      border-radius: 50%;
      animation: twinkle var(--dur) ease-in-out infinite;
      opacity: 0;
    }

    .sparkle.s--white {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.3);
    }

    .sparkle.s--purple {
      background: rgba(168, 85, 247, 0.8);
      box-shadow: 0 0 6px 1px rgba(168, 85, 247, 0.3);
    }

    .sparkle.s--rose {
      background: rgba(236, 72, 153, 0.7);
      box-shadow: 0 0 6px 1px rgba(236, 72, 153, 0.3);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }

    /* ===== CURSOR ===== */
    .cursor-glow {
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 50;
      transform: translate(-50%, -50%);
      will-change: left, top;
    }

    .cursor-dot {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
      pointer-events: none;
      z-index: 100;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.3);
      transition: width 0.2s, height 0.2s, background 0.2s;
    }

    .cursor-dot.clicking {
      width: 14px;
      height: 14px;
      background: rgba(168, 85, 247, 0.9);
    }

    .cursor-spark {
      position: fixed;
      pointer-events: none;
      z-index: 99;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      animation: sparkFade 0.6s ease-out forwards;
    }

    @keyframes sparkFade {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0) translateY(-10px); }
    }

    /* ===== GLASS CARD ===== */
    .card {
      position: relative;
      z-index: 10;
      padding: 60px 80px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.04) inset,
        0 20px 60px rgba(0, 0, 0, 0.3),
        0 0 120px rgba(168, 85, 247, 0.05);
      text-align: center;
      animation: cardIn 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      opacity: 0;
      transform: translateY(30px) scale(0.97);
    }

    @keyframes cardIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ===== GLOW LINE TOP ===== */
    .card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.5), rgba(236, 72, 153, 0.5), transparent);
      animation: glowLine 3s ease-in-out infinite;
    }

    @keyframes glowLine {
      0%, 100% { opacity: 0.4; left: 20%; right: 20%; }
      50% { opacity: 1; left: 10%; right: 10%; }
    }

    /* ===== BONJOUR ===== */
    .greeting {
      font-family: 'Sora', sans-serif;
      font-size: clamp(3.5rem, 11vw, 7.5rem);
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #e2e8f0, #ffffff, #c4b5fd, #f9a8d4, #e2e8f0);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientText 5s ease infinite;
      line-height: 1;
      position: relative;
    }

    .greeting .letter {
      display: inline-block;
      opacity: 0;
      animation: letterIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .greeting .letter:nth-child(1) { animation-delay: 0.4s; }
    .greeting .letter:nth-child(2) { animation-delay: 0.52s; }
    .greeting .letter:nth-child(3) { animation-delay: 0.64s; }
    .greeting .letter:nth-child(4) { animation-delay: 0.76s; }
    .greeting .letter:nth-child(5) { animation-delay: 0.88s; }
    .greeting .letter:nth-child(6) { animation-delay: 1.0s; }
    .greeting .letter:nth-child(7) { animation-delay: 1.12s; }

    @keyframes letterIn {
      0% {
        opacity: 0;
        transform: translateY(20px) rotateX(-40deg);
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotateX(0deg);
        filter: blur(0);
      }
    }

    @keyframes gradientText {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* ===== DIVIDER LINE ===== */
    .divider {
      width: 60px;
      height: 2px;
      margin: 28px auto 0;
      background: linear-gradient(90deg, rgba(168, 85, 247, 0.6), rgba(236, 72, 153, 0.6));
      border-radius: 2px;
      opacity: 0;
      animation: fadeIn 0.6s 1.3s ease forwards;
    }

    /* ===== HEARTS ===== */
    .hearts-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
      opacity: 0;
      animation: fadeIn 0.6s 1.5s ease forwards;
    }

    .mini-heart {
      font-size: 1.4rem;
      display: inline-block;
      animation: heartPulse 1.8s ease-in-out infinite;
      cursor: none;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
      opacity: 0.7;
    }

    .mini-heart:hover {
      transform: scale(1.9) !important;
      opacity: 1;
      filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.5));
    }

    .mini-heart:nth-child(1) { animation-delay: 0s; }
    .mini-heart:nth-child(2) { animation-delay: 0.2s; }
    .mini-heart:nth-child(3) { animation-delay: 0.4s; }
    .mini-heart:nth-child(4) { animation-delay: 0.2s; }
    .mini-heart:nth-child(5) { animation-delay: 0s; }

    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.2); }
      50% { transform: scale(1); }
      70% { transform: scale(1.1); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ===== CLICK BURST ===== */
    .click-burst {
      position: fixed;
      pointer-events: none;
      z-index: 200;
      font-size: 1.2rem;
      animation: burstUp 0.9s ease-out forwards;
    }

    @keyframes burstUp {
      0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.1) rotate(var(--rot)); }
    }

    /* ===== MOBILE ===== */
    @media (hover: none) {
      body { cursor: auto; }
      .cursor-glow, .cursor-dot { display: none; }
      .mini-heart { cursor: pointer; }
    }

    @media (max-width: 600px) {
      .card { padding: 40px 32px; border-radius: 18px; }
    }
  </style>
</head>
<body>

  <!-- BG -->
  <div class="bg">
    <div class="bg-orb bg-orb--1" style="--dx:60px;--dy:-40px;--sc:1.2"></div>
    <div class="bg-orb bg-orb--2" style="--dx:-50px;--dy:30px;--sc:0.9"></div>
    <div class="bg-orb bg-orb--3" style="--dx:30px;--dy:50px;--sc:1.1"></div>
  </div>
  <div class="noise"></div>

  <!-- Canvas -->
  <canvas id="particles"></canvas>

  <!-- Sparkles -->
  <div class="sparkle-container" id="sparkles"></div>

  <!-- Cursor -->
  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <!-- Card -->
  <div class="card" id="card">
    <div class="greeting">
      <span class="letter">B</span><span class="letter">o</span><span class="letter">n</span><span class="letter">j</span><span class="letter">o</span><span class="letter">u</span><span class="letter">r</span>
    </div>
    <div class="divider"></div>
    <div class="hearts-row">
      <span class="mini-heart">💜</span>
      <span class="mini-heart">🤍</span>
      <span class="mini-heart">💜</span>
      <span class="mini-heart">🤍</span>
      <span class="mini-heart">💜</span>
    </div>
  </div>

  <script>
    // ===== CURSOR =====
    const glow = document.getElementById('cursorGlow');
    const dot = document.getElementById('cursorDot');
    let mx = window.innerWidth / 2;
    let my = window.innerHeight / 2;
    let gx = mx, gy = my;
    let dx = mx, dy = my;

    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

    function tick() {
      gx += (mx - gx) * 0.08;
      gy += (my - gy) * 0.08;
      dx += (mx - dx) * 0.18;
      dy += (my - dy) * 0.18;
      glow.style.left = gx + 'px';
      glow.style.top = gy + 'px';
      dot.style.left = dx + 'px';
      dot.style.top = dy + 'px';
      requestAnimationFrame(tick);
    }
    tick();

    // ===== SPARK TRAIL =====
    let fc = 0;
    document.addEventListener('mousemove', e => {
      fc++;
      if (fc % 5 !== 0) return;
      const s = document.createElement('div');
      s.className = 'cursor-spark';
      const sz = 2 + Math.random() * 3;
      s.style.width = sz + 'px';
      s.style.height = sz + 'px';
      s.style.left = (e.clientX + (Math.random() - 0.5) * 10) + 'px';
      s.style.top = (e.clientY + (Math.random() - 0.5) * 10) + 'px';
      document.body.appendChild(s);
      s.addEventListener('animationend', () => s.remove());
    });

    // ===== CLICK DOT EFFECT =====
    document.addEventListener('mousedown', () => dot.classList.add('clicking'));
    document.addEventListener('mouseup', () => dot.classList.remove('clicking'));

    // ===== 3D TILT ON CARD =====
    const card = document.getElementById('card');
    document.addEventListener('mousemove', e => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const rx = ((e.clientY - cy) / cy) * -4;
      const ry = ((e.clientX - cx) / cx) * 4;
      card.style.transform = `perspective(800px) rotateX(${rx}deg) rotateY(${ry}deg)`;
    });

    // ===== CANVAS PARTICLES =====
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const particles = [];
    const symbols = ['✦', '✧', '·', '◦', '♡', '·'];

    function spawn(init) {
      return {
        x: Math.random() * W,
        y: init ? Math.random() * H : H + 10,
        size: 1 + Math.random() * 2.5,
        speedY: -(0.08 + Math.random() * 0.25),
        speedX: (Math.random() - 0.5) * 0.15,
        opacity: 0.1 + Math.random() * 0.3,
        wobble: Math.random() * Math.PI * 2,
        wSpeed: 0.005 + Math.random() * 0.01,
        symbol: symbols[Math.floor(Math.random() * symbols.length)]
      };
    }

    for (let i = 0; i < 60; i++) particles.push(spawn(true));

    function loop() {
      ctx.clearRect(0, 0, W, H);
      for (const p of particles) {
        p.wobble += p.wSpeed;
        p.x += p.speedX + Math.sin(p.wobble) * 0.15;
        p.y += p.speedY;
        if (p.y < -20) Object.assign(p, spawn(false));
        ctx.save();
        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = '#fff';
        ctx.font = p.size + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.symbol, p.x, p.y);
        ctx.restore();
      }
      requestAnimationFrame(loop);
    }
    loop();

    // ===== SPARKLES =====
    const sparkleBox = document.getElementById('sparkles');
    const sparkleTypes = ['s--white', 's--purple', 's--rose'];
    for (let i = 0; i < 45; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle ' + sparkleTypes[Math.floor(Math.random() * sparkleTypes.length)];
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
      s.style.animationDelay = (Math.random() * 5) + 's';
      const sz = 1.5 + Math.random() * 3;
      s.style.width = sz + 'px';
      s.style.height = sz + 'px';
      sparkleBox.appendChild(s);
    }

    // ===== CLICK BURST =====
    const burstSyms = ['✦', '♡', '✧', '💜', '🤍', '·'];
    document.addEventListener('click', e => {
      for (let i = 0; i < 12; i++) {
        const el = document.createElement('span');
        el.className = 'click-burst';
        el.textContent = burstSyms[Math.floor(Math.random() * burstSyms.length)];
        el.style.left = e.clientX + 'px';
        el.style.top = e.clientY + 'px';
        const angle = (Math.PI * 2 / 12) * i + (Math.random() - 0.5) * 0.5;
        const dist = 40 + Math.random() * 60;
        el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--ty', Math.sin(angle) * dist - 30 + 'px');
        el.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
        el.style.fontSize = (0.8 + Math.random() * 0.6) + 'rem';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    });
  </script>
</body>
</html>
