<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonjour Mon Amour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1, #fce4ec);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== FLOATING PARTICLES CANVAS ===== */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ===== SPARKLE OVERLAY ===== */
    .sparkle-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--dur) ease-in-out infinite;
      opacity: 0;
      box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.6);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.3); }
      50% { opacity: 1; transform: scale(1); }
    }

    /* ===== MAIN CONTENT ===== */
    .content {
      text-align: center;
      z-index: 10;
      position: relative;
    }

    .greeting-wrapper {
      position: relative;
      display: inline-block;
    }

    .greeting {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(3.5rem, 12vw, 9rem);
      font-weight: 700;
      color: transparent;
      background: linear-gradient(135deg, #e91e63, #f06292, #ad1457, #ec407a);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      animation: textGlow 3s ease-in-out infinite, fadeInUp 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      opacity: 0;
      transform: translateY(40px);
      filter: drop-shadow(0 0 30px rgba(233, 30, 99, 0.3));
      letter-spacing: 2px;
    }

    @keyframes textGlow {
      0%, 100% { background-position: 0% 50%; filter: drop-shadow(0 0 30px rgba(233, 30, 99, 0.3)); }
      50% { background-position: 100% 50%; filter: drop-shadow(0 0 50px rgba(233, 30, 99, 0.5)); }
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .hearts-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
      opacity: 0;
      animation: fadeInUp 1s 0.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    .mini-heart {
      font-size: 1.8rem;
      animation: heartBeat 1.4s ease-in-out infinite;
      cursor: default;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .mini-heart:hover {
      transform: scale(1.6) rotate(10deg);
      filter: drop-shadow(0 0 12px rgba(233, 30, 99, 0.6));
    }

    .mini-heart:nth-child(2) { animation-delay: 0.2s; }
    .mini-heart:nth-child(3) { animation-delay: 0.4s; }
    .mini-heart:nth-child(4) { animation-delay: 0.6s; }
    .mini-heart:nth-child(5) { animation-delay: 0.8s; }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.25); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
    }

    .message {
      font-family: 'Quicksand', sans-serif;
      font-size: clamp(0.95rem, 2.5vw, 1.35rem);
      font-weight: 300;
      color: #880e4f;
      margin-top: 30px;
      opacity: 0;
      animation: fadeInUp 1s 0.9s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      max-width: 500px;
      line-height: 1.8;
      letter-spacing: 0.5px;
    }

    .message .highlight {
      font-weight: 600;
      color: #c2185b;
    }

    .sub-message {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      color: #ad1457;
      margin-top: 22px;
      opacity: 0;
      animation: fadeInUp 1s 1.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      font-weight: 700;
    }

    .flower-divider {
      margin-top: 28px;
      font-size: 1.6rem;
      letter-spacing: 16px;
      opacity: 0;
      animation: fadeInUp 1s 1.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    /* ===== CLICK HEART BURST ===== */
    .click-heart {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      font-size: 1.5rem;
      animation: floatUp 1.4s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translateY(-180px) scale(0.4) rotate(25deg); }
    }

    /* ===== GLOW RING BEHIND TEXT ===== */
    .glow-ring {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(236, 64, 122, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulseRing 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulseRing {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
    }
  </style>
</head>
<body>

  <!-- Particles canvas -->
  <canvas id="particles"></canvas>

  <!-- Sparkles -->
  <div class="sparkle-container" id="sparkles"></div>

  <!-- Main Content -->
  <div class="content">
    <div class="greeting-wrapper">
      <div class="glow-ring"></div>
      <div class="greeting">Bonjour</div>
    </div>

    <div class="hearts-row">
      <span class="mini-heart">💗</span>
      <span class="mini-heart">💖</span>
      <span class="mini-heart">💕</span>
      <span class="mini-heart">💖</span>
      <span class="mini-heart">💗</span>
    </div>

    <p class="message">
      This page exists because <span class="highlight">you exist</span>.<br>
      Just seeing your face makes my whole day better.
    </p>

    <div class="sub-message">Je t'aime, infiniment</div>

    <div class="flower-divider">🌸 🌷 🌹 🌷 🌸</div>
  </div>

  <script>
    // ===== FLOATING HEARTS + PETALS =====
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const hearts = [];
    const petals = [];
    const HEART符号 = ['♥', '♡', '❤', '🩷', '💗', '💖'];
    const PETAL符号 = ['🌸', '🌷', '🪷', '✿', '❀'];

    class Particle {
      constructor(type) {
        this.type = type;
        this.reset();
      }

      reset() {
        this.x = Math.random() * W;
        this.y = this.type === 'heart' ? H + 30 : -30;
        this.size = this.type === 'heart'
          ? 12 + Math.random() * 18
          : 14 + Math.random() * 16;
        this.speedY = -(0.3 + Math.random() * 0.8);
        this.speedX = (Math.random() - 0.5) * 0.6;
        this.opacity = 0.2 + Math.random() * 0.5;
        this.wobble = Math.random() * Math.PI * 2;
        this.wobbleSpeed = 0.01 + Math.random() * 0.02;
        this.rotation = Math.random() * 360;
        this.rotSpeed = (Math.random() - 0.5) * 1.2;
        this.symbol = this.type === 'heart'
          ? HEART符号[Math.floor(Math.random() * HEART符号.length)]
          : PETAL符号[Math.floor(Math.random() * PETAL符号.length)];
      }

      update() {
        this.wobble += this.wobbleSpeed;
        this.x += this.speedX + Math.sin(this.wobble) * 0.4;
        this.y += this.speedY;
        this.rotation += this.rotSpeed;

        if (this.type === 'heart' && this.y < -40) this.reset();
        if (this.type === 'petal' && this.y > H + 40) this.reset();
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = this.opacity;
        ctx.font = `${this.size}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.symbol, 0, 0);
        ctx.restore();
      }
    }

    for (let i = 0; i < 18; i++) hearts.push(new Particle('heart'));
    for (let i = 0; i < 14; i++) petals.push(new Particle('petal'));

    function animate() {
      ctx.clearRect(0, 0, W, H);
      hearts.forEach(p => { p.update(); p.draw(); });
      petals.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    // ===== SPARKLES =====
    const sparkleBox = document.getElementById('sparkles');
    for (let i = 0; i < 50; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.setProperty('--dur', (1.5 + Math.random() * 3) + 's');
      s.style.animationDelay = Math.random() * 4 + 's';
      s.style.width = s.style.height = (2 + Math.random() * 4) + 'px';
      sparkleBox.appendChild(s);
    }

    // ===== CLICK TO BURST HEARTS =====
    const burstSymbols = ['💗', '💖', '💕', '🩷', '✨', '🤍'];
    document.addEventListener('click', (e) => {
      for (let i = 0; i < 6; i++) {
        const span = document.createElement('span');
        span.className = 'click-heart';
        span.textContent = burstSymbols[Math.floor(Math.random() * burstSymbols.length)];
        span.style.left = (e.clientX + (Math.random() - 0.5) * 60) + 'px';
        span.style.top = (e.clientY + (Math.random() - 0.5) * 40) + 'px';
        span.style.animationDuration = (1 + Math.random() * 0.8) + 's';
        document.body.appendChild(span);
        span.addEventListener('animationend', () => span.remove());
      }
    });
  </script>
</body>
</html>
