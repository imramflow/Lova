<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonjour Yousra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh; overflow: hidden;
      font-family: 'Playfair Display', serif;
      background: linear-gradient(180deg, #fef9f3 0%, #fdf0e8 40%, #fde8e0 70%, #fdf2f8 100%);
      display: flex; align-items: center; justify-content: center;
      position: relative; cursor: default;
    }

    /* ===== THREE.JS CANVAS ===== */
    #three-canvas {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
    }

    /* ===== SPARKLES ===== */
    .sparkles {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
    }
    .sparkle {
      position: absolute; border-radius: 50%; opacity: 0;
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
    }
    .sp-gold { background: #d4a853; box-shadow: 0 0 4px 1px rgba(212,168,83,0.3); }
    .sp-rose { background: #e8a0b4; box-shadow: 0 0 4px 1px rgba(232,160,180,0.3); }
    .sp-white { background: #fff; box-shadow: 0 0 4px 1px rgba(255,255,255,0.4); }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 0.85; transform: scale(1); }
    }

    /* ===== CARD ===== */
    .card-wrap {
      position: relative; z-index: 10;
      opacity: 0; transform: scale(0.92);
    }
    .card {
      padding: 60px 80px 50px; border-radius: 28px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(212,168,83,0.12),
        0 20px 60px rgba(180,120,90,0.1),
        0 4px 16px rgba(180,120,90,0.06),
        0 0 100px rgba(200,160,140,0.08);
      text-align: center;
      position: relative;
    }
    .card::before {
      content: ''; position: absolute; inset: -1px; border-radius: 29px; padding: 1px;
      background: linear-gradient(135deg, rgba(212,168,83,0.3), rgba(201,112,90,0.2), rgba(212,168,83,0.1), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none;
    }

    /* ===== TEXT ===== */
    .greeting { line-height: 1.1; }
    .word--main {
      display: block;
      font-size: clamp(3rem, 9vw, 5.5rem);
      font-weight: 600; letter-spacing: -0.5px;
      color: #b8860b;
      text-shadow: 0 2px 20px rgba(184,134,11,0.15);
    }
    .word--name {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      font-weight: 300; font-style: italic;
      letter-spacing: 3px; margin-top: 4px;
      color: #c9705a;
      text-shadow: 0 2px 16px rgba(201,112,90,0.12);
    }
    .letter {
      display: inline-block; opacity: 0;
      transition: color 0.3s, text-shadow 0.3s;
    }
    .letter:hover {
      color: #d4a853 !important;
      text-shadow: 0 0 24px rgba(212,168,83,0.35) !important;
    }
    .letter.revealed {
      animation: letterUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes letterUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ===== HEARTS ROW ===== */
    .hearts-row {
      display: flex; justify-content: center; gap: 18px;
      margin-top: 28px; opacity: 0;
    }
    .h-heart {
      width: 18px; height: 16px; position: relative;
      animation: heartPulse 2.4s ease-in-out infinite;
    }
    .h-heart::before, .h-heart::after {
      content: ''; position: absolute; top: 0;
      width: 11px; height: 16px; border-radius: 11px 11px 0 0;
      background: var(--hc);
    }
    .h-heart::before { left: 9px; transform: rotate(-45deg); transform-origin: 0 100%; }
    .h-heart::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }
    .h-heart:nth-child(1) { --hc: #d4a853; animation-delay: 0s; }
    .h-heart:nth-child(2) { --hc: #c9705a; animation-delay: 0.3s; }
    .h-heart:nth-child(3) { --hc: #e8a0b4; animation-delay: 0.6s; }
    .h-heart:nth-child(4) { --hc: #c9705a; animation-delay: 0.3s; }
    .h-heart:nth-child(5) { --hc: #d4a853; animation-delay: 0s; }
    @keyframes heartPulse {
      0%, 100% { transform: scale(1) translateY(0); }
      30% { transform: scale(1.15) translateY(-3px); }
      60% { transform: scale(1.05) translateY(-1px); }
    }

    /* ===== AUDIO BTN ===== */
    .audio-btn {
      position: fixed; bottom: 28px; right: 28px; z-index: 60;
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(212,168,83,0.2);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(0.8);
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
      box-shadow: 0 4px 20px rgba(180,120,90,0.1);
    }
    .audio-btn:hover {
      background: rgba(255,255,255,0.9);
      border-color: rgba(212,168,83,0.4);
      box-shadow: 0 4px 30px rgba(184,134,11,0.15);
    }
    .audio-btn svg {
      width: 20px; height: 20px; fill: #b8860b;
      transition: fill 0.3s;
    }
    .audio-btn.playing svg { fill: #c9705a; }
    .audio-btn .eq-bars {
      display: flex; gap: 2px; align-items: flex-end; height: 16px;
    }
    .audio-btn .eq-bar {
      width: 3px; border-radius: 1.5px; background: #b8860b;
      transition: height 0.3s;
    }
    .audio-btn.playing .eq-bar { animation: eqAnim 0.7s ease-in-out infinite alternate; }
    .audio-btn .eq-bar:nth-child(1) { height: 5px; --mh: 14px; }
    .audio-btn .eq-bar:nth-child(2) { height: 9px; --mh: 8px; }
    .audio-btn .eq-bar:nth-child(3) { height: 3px; --mh: 16px; }
    .audio-btn .eq-bar:nth-child(4) { height: 7px; --mh: 10px; }
    .audio-btn:not(.playing) .eq-bar { height: 3px !important; animation: none; }
    @keyframes eqAnim { 0% { height: 3px; } 100% { height: var(--mh); } }

    /* ===== AUDIO HINT ===== */
    .audio-hint {
      position: fixed; bottom: 90px; right: 20px; z-index: 60;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem; font-style: italic;
      color: #c9705a; opacity: 0;
      letter-spacing: 0.5px;
    }

    /* ===== CLICK RIPPLE ===== */
    .ripple {
      position: fixed; pointer-events: none; z-index: 49;
      border: 1.5px solid rgba(212,168,83,0.3); border-radius: 50%;
      animation: rippleOut 0.9s ease-out forwards;
    }
    @keyframes rippleOut {
      0% { width: 0; height: 0; opacity: 0.6; transform: translate(-50%,-50%); }
      100% { width: 120px; height: 120px; opacity: 0; transform: translate(-50%,-50%); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .card { padding: 44px 32px 36px; border-radius: 20px; }
      .word--main { font-size: clamp(2.4rem, 10vw, 3.5rem); }
      .word--name { font-size: clamp(1.8rem, 7vw, 2.6rem); }
      .audio-btn { width: 56px; height: 56px; bottom: 20px; right: 20px; }
      .audio-hint { bottom: 86px; right: 16px; }
    }
  </style>
</head>
<body>

  <canvas id="three-canvas"></canvas>

  <div class="sparkles" id="sparkles"></div>

  <div class="card-wrap" id="cardWrap">
    <div class="card" id="card">
      <div class="greeting">
        <div class="word--main" id="wordMain"></div>
        <div class="word--name" id="wordName"></div>
      </div>
      <div class="hearts-row" id="heartsRow">
        <div class="h-heart"></div>
        <div class="h-heart"></div>
        <div class="h-heart"></div>
        <div class="h-heart"></div>
        <div class="h-heart"></div>
      </div>
    </div>
  </div>

  <button class="audio-btn" id="audioBtn" title="Toggle music">
    <div class="eq-bars">
      <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
    </div>
  </button>
  <div class="audio-hint" id="audioHint">Appuyez pour écouter</div>

  <!-- CDN Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>

  <script>
    // ============================================
    // BUILD GREETING LETTERS
    // ============================================
    const wordMain = document.getElementById('wordMain');
    const wordName = document.getElementById('wordName');
    'Bonjour'.split('').forEach(c => {
      const s = document.createElement('span');
      s.className = 'letter'; s.textContent = c;
      wordMain.appendChild(s);
    });
    'Yousra'.split('').forEach(c => {
      const s = document.createElement('span');
      s.className = 'letter'; s.textContent = c;
      wordName.appendChild(s);
    });
    const allLetters = document.querySelectorAll('.letter');

    // ============================================
    // SPARKLES
    // ============================================
    const sparkleBox = document.getElementById('sparkles');
    const spClasses = ['sp-gold', 'sp-rose', 'sp-white'];
    for (let i = 0; i < 35; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle ' + spClasses[i % 3];
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.setProperty('--dur', (2.5 + Math.random() * 4) + 's');
      s.style.setProperty('--delay', (Math.random() * 5) + 's');
      const sz = 2 + Math.random() * 3;
      s.style.width = sz + 'px';
      s.style.height = sz + 'px';
      sparkleBox.appendChild(s);
    }

    // ============================================
    // CLICK RIPPLE
    // ============================================
    document.addEventListener('click', e => {
      if (e.target.closest('.audio-btn')) return;
      const r = document.createElement('div');
      r.className = 'ripple';
      r.style.left = e.clientX + 'px';
      r.style.top = e.clientY + 'px';
      document.body.appendChild(r);
      r.addEventListener('animationend', () => r.remove());
    });

    // ============================================
    // THREE.JS — FLOATING ROSE PETALS
    // ============================================
    const canvas = document.getElementById('three-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.z = 5;

    // Create heart-shaped texture on offscreen canvas
    function makeHeartTexture(color, glowColor) {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const cx = c.getContext('2d');

      // glow
      const grd = cx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grd.addColorStop(0, glowColor);
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      cx.fillStyle = grd;
      cx.fillRect(0, 0, 128, 128);

      // heart shape
      cx.save();
      cx.translate(64, 64);
      cx.scale(1.8, 1.8);
      cx.beginPath();
      cx.moveTo(0, 8);
      cx.bezierCurveTo(-2, 4, -28, -12, 0, -28);
      cx.bezierCurveTo(28, -12, 2, 4, 0, 8);
      cx.closePath();

      const hgrd = cx.createRadialGradient(-5, -8, 0, 0, 0, 25);
      hgrd.addColorStop(0, color);
      hgrd.addColorStop(1, 'rgba(0,0,0,0.1)');
      cx.fillStyle = hgrd;
      cx.fill();

      // highlight
      cx.beginPath();
      cx.arc(-6, -12, 4, 0, Math.PI * 2);
      cx.fillStyle = 'rgba(255,255,255,0.45)';
      cx.fill();
      cx.restore();

      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    const heartTextures = [
      makeHeartTexture('#d4a853', 'rgba(212,168,83,0.25)'),
      makeHeartTexture('#c9705a', 'rgba(201,112,90,0.25)'),
      makeHeartTexture('#e8a0b4', 'rgba(232,160,180,0.2)'),
      makeHeartTexture('#b8860b', 'rgba(184,134,11,0.2)'),
      makeHeartTexture('#d4956a', 'rgba(212,149,106,0.2)'),
    ];

    // Particle system
    const COUNT = 65;
    const positions = new Float32Array(COUNT * 3);
    const scales = new Float32Array(COUNT);
    const speeds = new Float32Array(COUNT);
    const drifts = new Float32Array(COUNT);
    const phases = new Float32Array(COUNT);

    for (let i = 0; i < COUNT; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 12;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 10;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 6 - 1;
      scales[i] = 0.08 + Math.random() * 0.18;
      speeds[i] = 0.002 + Math.random() * 0.006;
      drifts[i] = (Math.random() - 0.5) * 0.003;
      phases[i] = Math.random() * Math.PI * 2;
    }

    const spriteMat = new THREE.SpriteMaterial({
      map: heartTextures[0],
      transparent: true,
      opacity: 0,
      depthWrite: false,
      blending: THREE.NormalBlending,
    });

    const sprites = [];
    for (let i = 0; i < COUNT; i++) {
      const mat = spriteMat.clone();
      mat.map = heartTextures[Math.floor(Math.random() * heartTextures.length)];
      mat.opacity = 0;
      const sprite = new THREE.Sprite(mat);
      sprite.position.set(positions[i*3], positions[i*3+1], positions[i*3+2]);
      sprite.scale.set(scales[i], scales[i], 1);
      scene.add(sprite);
      sprites.push(sprite);
    }

    // Mouse tracking
    let mouseX = 0, mouseY = 0;
    let targetRotX = 0, targetRotY = 0;
    document.addEventListener('mousemove', e => {
      mouseX = (e.clientX / innerWidth - 0.5) * 2;
      mouseY = (e.clientY / innerHeight - 0.5) * 2;
    });

    // Animation loop
    let heartsVisible = false;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Smooth camera rotation from mouse
      targetRotX += (mouseY * 0.15 - targetRotX) * 0.03;
      targetRotY += (mouseX * -0.15 - targetRotY) * 0.03;
      scene.rotation.x = targetRotX;
      scene.rotation.y = targetRotY;

      // Animate hearts
      for (let i = 0; i < COUNT; i++) {
        const sp = sprites[i];
        // float upward
        sp.position.y += speeds[i];
        // gentle horizontal drift
        sp.position.x += Math.sin(t * 0.5 + phases[i]) * drifts[i];
        // rotation
        sp.material.rotation = Math.sin(t * 0.3 + phases[i]) * 0.4;

        // wrap around
        if (sp.position.y > 7) {
          sp.position.y = -7;
          sp.position.x = (Math.random() - 0.5) * 12;
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ============================================
    // AUDIO — HOWLER + WEB AUDIO API FALLBACK
    // ============================================
    let audioMode = null; // 'howler' | 'webaudio' | null
    let pianoPlaying = false;

    // --- Howler attempt ---
    let howl = null;
    try {
      howl = new Howl({
        src: [
          'https://upload.wikimedia.org/wikipedia/commons/4/42/Claire_de_lune_%28Claude_Debussy%29.ogg'
        ],
        html5: true,
        volume: 0.35,
        loop: true,
        onloaderror: () => { console.log('Howler load failed'); },
        onplayerror: () => { console.log('Howler play failed'); }
      });
    } catch (e) { console.log('Howler init failed'); }

    // --- Web Audio API fallback ---
    let audioCtx = null;
    let masterGain = null;
    let pianoTimeout = null;
    let chordIndex = 0;
    let noteIndex = 0;

    const NOTES = {
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23,
      G4: 392.00, A4: 440.00, B4: 493.88,
      C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99,
    };

    const PROGRESSION = [
      [NOTES.C4, NOTES.E4, NOTES.G4, NOTES.C5, NOTES.E5],
      [NOTES.A4, NOTES.C5, NOTES.E5, NOTES.A4, NOTES.C5],
      [NOTES.F4, NOTES.A4, NOTES.C5, NOTES.F5, NOTES.A4],
      [NOTES.G4, NOTES.B4, NOTES.D5, NOTES.G5, NOTES.B4],
    ];

    function initWebAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.22;
      masterGain.connect(audioCtx.destination);

      // reverb
      const delay = audioCtx.createDelay(0.5);
      delay.delayTime.value = 0.25;
      const fb = audioCtx.createGain();
      fb.gain.value = 0.25;
      const wet = audioCtx.createGain();
      wet.gain.value = 0.18;
      masterGain.connect(delay);
      delay.connect(fb);
      fb.connect(delay);
      delay.connect(wet);
      wet.connect(audioCtx.destination);
    }

    function playNote(freq, time, duration) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime + time;
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.35, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(now);
      osc.stop(now + duration);

      // harmonic
      const osc2 = audioCtx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.value = freq * 2;
      const g2 = audioCtx.createGain();
      g2.gain.setValueAtTime(0.08, now);
      g2.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.5);
      osc2.connect(g2);
      g2.connect(masterGain);
      osc2.start(now);
      osc2.stop(now + duration);
    }

    function webAudioLoop() {
      if (!pianoPlaying) return;
      const chord = PROGRESSION[chordIndex];
      const note = chord[noteIndex];
      const isLast = noteIndex === chord.length - 1;
      playNote(note, 0, isLast ? 2.0 : 1.2);

      noteIndex++;
      if (noteIndex >= chord.length) {
        noteIndex = 0;
        chordIndex = (chordIndex + 1) % PROGRESSION.length;
      }

      pianoTimeout = setTimeout(webAudioLoop, (isLast ? 0.9 : 0.45) * 1000);
    }

    // --- Toggle logic ---
    function tryHowler() {
      if (!howl) return false;
      try {
        if (howl.playing()) { howl.pause(); return true; }
        howl.play();
        audioMode = 'howler';
        return true;
      } catch (e) { return false; }
    }

    function startWebAudio() {
      initWebAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      pianoPlaying = true;
      chordIndex = 0;
      noteIndex = 0;
      // Play first note IMMEDIATELY (inside user gesture!)
      const chord = PROGRESSION[0];
      playNote(chord[0], 0, 1.2);
      noteIndex = 1;
      pianoTimeout = setTimeout(webAudioLoop, 450);
      audioMode = 'webaudio';
    }

    function stopWebAudio() {
      pianoPlaying = false;
      clearTimeout(pianoTimeout);
      audioMode = null;
    }

    // ============================================
    // AUDIO BUTTON
    // ============================================
    const audioBtn = document.getElementById('audioBtn');
    const audioHint = document.getElementById('audioHint');

    audioBtn.addEventListener('click', e => {
      e.stopPropagation();

      if (audioMode === 'howler') {
        howl.pause();
        audioBtn.classList.remove('playing');
        audioMode = null;
        return;
      }
      if (audioMode === 'webaudio') {
        stopWebAudio();
        audioBtn.classList.remove('playing');
        return;
      }

      // Try Howler first, fallback to Web Audio
      if (tryHowler()) {
        audioBtn.classList.add('playing');
        audioHint.style.opacity = '0';
        return;
      }

      startWebAudio();
      audioBtn.classList.add('playing');
      audioHint.style.opacity = '0';
    });

    // Auto-play on first click anywhere
    let firstClick = true;
    document.addEventListener('click', () => {
      if (!firstClick) return;
      firstClick = false;
      if (audioMode) return;
      // Try Howler
      if (tryHowler()) {
        audioBtn.classList.add('playing');
        return;
      }
      // Fallback
      startWebAudio();
      audioBtn.classList.add('playing');
    }, { once: false });

    // ============================================
    // CARD TILT
    // ============================================
    const card = document.getElementById('card');
    document.addEventListener('mousemove', e => {
      const cx = innerWidth / 2, cy = innerHeight / 2;
      const rx = ((e.clientY - cy) / cy) * -2.5;
      const ry = ((e.clientX - cx) / cx) * 2.5;
      card.style.transform = `perspective(800px) rotateX(${rx}deg) rotateY(${ry}deg)`;
    });

    // ============================================
    // GSAP LOAD SEQUENCE
    // ============================================
    const tl = gsap.timeline({ delay: 0.3 });

    // Card entrance
    tl.to('#cardWrap', {
      opacity: 1,
      scale: 1,
      duration: 1,
      ease: 'elastic.out(1, 0.6)',
    });

    // Bonjour letters
    const mainLetters = wordMain.querySelectorAll('.letter');
    mainLetters.forEach((l, i) => {
      tl.add(() => l.classList.add('revealed'), 0.8 + i * 0.09);
    });

    // Yousra letters
    const nameLetters = wordName.querySelectorAll('.letter');
    nameLetters.forEach((l, i) => {
      tl.add(() => l.classList.add('revealed'), 1.5 + i * 0.09);
    });

    // Hearts row
    tl.to('#heartsRow', { opacity: 1, duration: 0.6, ease: 'power2.out' }, 2.2);

    // Three.js hearts fade in
    tl.add(() => {
      heartsVisible = true;
      sprites.forEach((sp, i) => {
        gsap.to(sp.material, {
          opacity: 0.4 + Math.random() * 0.4,
          duration: 1.5 + Math.random(),
          delay: i * 0.02,
          ease: 'power2.out',
        });
      });
    }, 2.0);

    // Audio button
    tl.to('#audioBtn', {
      opacity: 1,
      scale: 1,
      duration: 0.5,
      ease: 'back.out(1.7)',
    }, 2.6);

    // Audio hint
    tl.to('#audioHint', {
      opacity: 0.7,
      duration: 0.6,
      ease: 'power2.out',
    }, 2.8);

    // Fade hint after 4s
    tl.to('#audioHint', {
      opacity: 0,
      duration: 0.8,
      ease: 'power2.in',
    }, 6.5);
  </script>
</body>
</html>
