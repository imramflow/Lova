<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonjour Yousra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh; overflow: hidden;
      font-family: 'Playfair Display', serif;
      background: #0a0a0f;
      display: flex; align-items: center; justify-content: center;
      position: relative; cursor: default;
    }

    /* ===== BACKGROUND GLOW ===== */
    .bg-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(212,168,83,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 40% 45%, rgba(201,112,90,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 40% 35% at 60% 55%, rgba(184,134,11,0.04) 0%, transparent 50%);
    }

    /* ===== GLOW ORBS ===== */
    .orb {
      position: fixed; border-radius: 50%; pointer-events: none;
      filter: blur(80px); z-index: 1;
      transition: transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .orb--1 { width: 400px; height: 400px; background: rgba(212,168,83,0.07); top: 30%; left: 35%; }
    .orb--2 { width: 300px; height: 300px; background: rgba(201,112,90,0.06); top: 45%; right: 30%; }
    .orb--3 { width: 250px; height: 250px; background: rgba(184,134,11,0.05); bottom: 25%; left: 45%; }

    /* ===== CANVAS ===== */
    #heartsCanvas {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
    }

    /* ===== SPARKLES ===== */
    .sparkles { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
    .sparkle {
      position: absolute; border-radius: 50%; opacity: 0;
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
    }
    .sp-g { background: #d4a853; box-shadow: 0 0 6px 2px rgba(212,168,83,0.3); }
    .sp-r { background: #c9705a; box-shadow: 0 0 6px 2px rgba(201,112,90,0.25); }
    .sp-w { background: #fff; box-shadow: 0 0 6px 2px rgba(255,255,255,0.2); }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 0.9; transform: scale(1); }
    }

    /* ===== TEXT CONTAINER ===== */
    .text-wrap {
      position: relative; z-index: 10; text-align: center;
      opacity: 0; transform: translateY(30px);
    }
    .greeting { line-height: 1.05; }
    .word--main {
      display: block;
      font-size: clamp(3.5rem, 11vw, 7.5rem);
      font-weight: 700; letter-spacing: -1px;
      color: #f5f0e8;
      text-shadow:
        0 0 40px rgba(212,168,83,0.2),
        0 0 80px rgba(212,168,83,0.08),
        0 2px 30px rgba(0,0,0,0.5);
    }
    .word--name {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 6.5vw, 4.5rem);
      font-weight: 300; font-style: italic;
      letter-spacing: 6px; margin-top: 2px;
      color: #d4a853;
      text-shadow:
        0 0 30px rgba(212,168,83,0.3),
        0 0 60px rgba(212,168,83,0.1),
        0 2px 20px rgba(0,0,0,0.4);
    }
    .letter {
      display: inline-block; opacity: 0;
      transition: color 0.3s, text-shadow 0.3s, transform 0.3s;
    }
    .letter.revealed {
      animation: letterIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .letter:hover {
      color: #d4a853 !important;
      text-shadow: 0 0 30px rgba(212,168,83,0.5) !important;
      transform: translateY(-3px) !important;
    }
    @keyframes letterIn {
      0% { opacity: 0; transform: translateY(25px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== DIVIDER LINE ===== */
    .divider {
      width: 0; height: 1px; margin: 12px auto 0;
      background: linear-gradient(90deg, transparent, rgba(212,168,83,0.4), rgba(201,112,90,0.3), transparent);
      opacity: 0;
    }

    /* ===== HEARTS ROW ===== */
    .hearts-row {
      display: flex; justify-content: center; gap: 20px;
      margin-top: 24px; opacity: 0;
    }
    .h-heart {
      width: 14px; height: 13px; position: relative;
      animation: heartPulse 2.4s ease-in-out infinite;
    }
    .h-heart::before, .h-heart::after {
      content: ''; position: absolute; top: 0;
      width: 9px; height: 13px; border-radius: 9px 9px 0 0;
      background: var(--hc);
    }
    .h-heart::before { left: 7px; transform: rotate(-45deg); transform-origin: 0 100%; }
    .h-heart::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }
    .h-heart:nth-child(1) { --hc: #d4a853; animation-delay: 0s; }
    .h-heart:nth-child(2) { --hc: #c9705a; animation-delay: 0.3s; }
    .h-heart:nth-child(3) { --hc: #e8a0b4; animation-delay: 0.6s; }
    .h-heart:nth-child(4) { --hc: #c9705a; animation-delay: 0.3s; }
    .h-heart:nth-child(5) { --hc: #d4a853; animation-delay: 0s; }
    @keyframes heartPulse {
      0%, 100% { transform: scale(1) translateY(0); }
      30% { transform: scale(1.2) translateY(-3px); }
      60% { transform: scale(1.05) translateY(-1px); }
    }

    /* ===== SUBTITLE ===== */
    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      font-style: italic; font-weight: 300;
      color: rgba(212,168,83,0.5);
      letter-spacing: 3px; text-transform: lowercase;
      margin-top: 20px; opacity: 0;
    }

    /* ===== AUDIO BTN ===== */
    .audio-btn {
      position: fixed; bottom: 32px; right: 32px; z-index: 60;
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(212,168,83,0.08);
      border: 1px solid rgba(212,168,83,0.15);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(0.7);
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.3s;
      box-shadow: 0 4px 30px rgba(0,0,0,0.3);
    }
    .audio-btn:hover {
      background: rgba(212,168,83,0.15);
      border-color: rgba(212,168,83,0.3);
      box-shadow: 0 4px 40px rgba(212,168,83,0.1);
      transform: scale(1.08);
    }
    .audio-btn .eq-bars { display: flex; gap: 2.5px; align-items: flex-end; height: 18px; }
    .audio-btn .eq-bar {
      width: 3px; border-radius: 2px;
      background: linear-gradient(to top, #d4a853, #c9705a);
      transition: height 0.3s;
    }
    .audio-btn.playing .eq-bar { animation: eqAnim 0.7s ease-in-out infinite alternate; }
    .audio-btn .eq-bar:nth-child(1) { height: 5px; --mh: 15px; }
    .audio-btn .eq-bar:nth-child(2) { height: 10px; --mh: 9px; }
    .audio-btn .eq-bar:nth-child(3) { height: 3px; --mh: 17px; }
    .audio-btn .eq-bar:nth-child(4) { height: 8px; --mh: 11px; }
    .audio-btn:not(.playing) .eq-bar { height: 3px !important; animation: none; }
    @keyframes eqAnim { 0% { height: 3px; } 100% { height: var(--mh); } }

    /* ===== CLICK RIPPLE ===== */
    .ripple {
      position: fixed; pointer-events: none; z-index: 49;
      border: 1px solid rgba(212,168,83,0.25); border-radius: 50%;
      animation: rippleOut 1s ease-out forwards;
    }
    @keyframes rippleOut {
      0% { width: 0; height: 0; opacity: 0.5; transform: translate(-50%,-50%); }
      100% { width: 140px; height: 140px; opacity: 0; transform: translate(-50%,-50%); }
    }

    /* ===== CLICK BURST ===== */
    .burst {
      position: fixed; pointer-events: none; z-index: 200;
      animation: burstUp 0.8s ease-out forwards;
    }
    @keyframes burstUp {
      0% { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx),var(--ty)) scale(0.2); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .word--main { font-size: clamp(2.5rem, 12vw, 4rem); }
      .word--name { font-size: clamp(1.6rem, 7vw, 2.8rem); letter-spacing: 3px; }
      .audio-btn { width: 52px; height: 52px; bottom: 20px; right: 20px; }
      .orb--1 { width: 250px; height: 250px; }
      .orb--2 { width: 180px; height: 180px; }
      .orb--3 { width: 150px; height: 150px; }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>
  <div class="orb orb--1" id="orb1"></div>
  <div class="orb orb--2" id="orb2"></div>
  <div class="orb orb--3" id="orb3"></div>

  <canvas id="heartsCanvas"></canvas>

  <div class="sparkles" id="sparkles"></div>

  <div class="text-wrap" id="textWrap">
    <div class="greeting">
      <div class="word--main" id="wordMain"></div>
      <div class="word--name" id="wordName"></div>
    </div>
    <div class="divider" id="divider"></div>
    <div class="hearts-row" id="heartsRow">
      <div class="h-heart"></div>
      <div class="h-heart"></div>
      <div class="h-heart"></div>
      <div class="h-heart"></div>
      <div class="h-heart"></div>
    </div>
    <div class="subtitle" id="subtitle">je t'adore</div>
  </div>

  <button class="audio-btn" id="audioBtn" title="Toggle music">
    <div class="eq-bars">
      <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
    </div>
  </button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    // ============================================
    // BUILD LETTERS
    // ============================================
    const wordMain = document.getElementById('wordMain');
    const wordName = document.getElementById('wordName');
    'Bonjour'.split('').forEach(c => {
      const s = document.createElement('span');
      s.className = 'letter'; s.textContent = c;
      wordMain.appendChild(s);
    });
    'Yousra'.split('').forEach(c => {
      const s = document.createElement('span');
      s.className = 'letter'; s.textContent = c;
      wordName.appendChild(s);
    });

    // ============================================
    // SPARKLES
    // ============================================
    const sparkleBox = document.getElementById('sparkles');
    const spCls = ['sp-g','sp-r','sp-w'];
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle ' + spCls[i % 3];
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.setProperty('--dur', (2 + Math.random() * 5) + 's');
      s.style.setProperty('--delay', (Math.random() * 6) + 's');
      const sz = 1.5 + Math.random() * 3;
      s.style.width = sz + 'px'; s.style.height = sz + 'px';
      sparkleBox.appendChild(s);
    }

    // ============================================
    // CLICK EFFECTS
    // ============================================
    document.addEventListener('click', e => {
      if (e.target.closest('.audio-btn')) return;
      // ripple
      const r = document.createElement('div');
      r.className = 'ripple';
      r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px';
      document.body.appendChild(r);
      r.addEventListener('animationend', () => r.remove());
      // burst
      const syms = ['✦','♡','·','✧'];
      const cols = ['#d4a853','#c9705a','#e8a0b4','#fff'];
      for (let i = 0; i < 12; i++) {
        const b = document.createElement('span');
        b.className = 'burst';
        b.textContent = syms[i % syms.length];
        b.style.left = e.clientX + 'px'; b.style.top = e.clientY + 'px';
        const a = (Math.PI * 2 / 12) * i + (Math.random() - 0.5) * 0.5;
        const d = 40 + Math.random() * 60;
        b.style.setProperty('--tx', Math.cos(a) * d + 'px');
        b.style.setProperty('--ty', Math.sin(a) * d - 15 + 'px');
        b.style.fontSize = (0.7 + Math.random() * 0.5) + 'rem';
        b.style.color = cols[i % cols.length];
        document.body.appendChild(b);
        b.addEventListener('animationend', () => b.remove());
      }
    });

    // ============================================
    // GLOW ORBS — MOUSE PARALLAX
    // ============================================
    const orb1 = document.getElementById('orb1');
    const orb2 = document.getElementById('orb2');
    const orb3 = document.getElementById('orb3');
    document.addEventListener('mousemove', e => {
      const cx = innerWidth / 2, cy = innerHeight / 2;
      const dx = (e.clientX - cx) / cx;
      const dy = (e.clientY - cy) / cy;
      orb1.style.transform = `translate(${dx * -20}px, ${dy * -20}px)`;
      orb2.style.transform = `translate(${dx * 15}px, ${dy * 15}px)`;
      orb3.style.transform = `translate(${dx * -10}px, ${dy * 12}px)`;
    });

    // ============================================
    // CANVAS — 3D FLOATING HEARTS
    // ============================================
    const cvs = document.getElementById('heartsCanvas');
    const ctx = cvs.getContext('2d');
    let W, H;
    function resize() { W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
    resize();
    addEventListener('resize', resize);

    // Mouse position normalized
    let mx = 0.5, my = 0.5;
    document.addEventListener('mousemove', e => {
      mx = e.clientX / innerWidth;
      my = e.clientY / innerHeight;
    });

    // Heart shape path
    function heartPath(cx, cy, s) {
      ctx.beginPath();
      const topY = cy - s * 0.4;
      ctx.moveTo(cx, cy + s * 0.35);
      ctx.bezierCurveTo(cx - s * 0.02, cy + s * 0.1, cx - s * 0.7, topY, cx, topY - s * 0.3);
      ctx.bezierCurveTo(cx + s * 0.7, topY, cx + s * 0.02, cy + s * 0.1, cx, cy + s * 0.35);
      ctx.closePath();
    }

    // Heart colors
    const hColors = [
      { fill: '#d4a853', glow: 'rgba(212,168,83,0.35)' },
      { fill: '#c9705a', glow: 'rgba(201,112,90,0.3)' },
      { fill: '#e8a0b4', glow: 'rgba(232,160,180,0.25)' },
      { fill: '#b8860b', glow: 'rgba(184,134,11,0.3)' },
      { fill: '#d4956a', glow: 'rgba(212,149,106,0.25)' },
      { fill: '#f5f0e8', glow: 'rgba(245,240,232,0.15)' },
    ];

    // Create hearts with 3 depth layers
    const hearts = [];
    const HEART_COUNT = 50;

    for (let i = 0; i < HEART_COUNT; i++) {
      const layer = i < 15 ? 0 : i < 35 ? 1 : 2; // 0=far, 1=mid, 2=near
      const layerCfg = [
        { sizeMin: 6, sizeMax: 12, speedMin: 0.15, speedMax: 0.35, alphaMin: 0.15, alphaMax: 0.3, blur: 0 },
        { sizeMin: 12, sizeMax: 22, speedMin: 0.25, speedMax: 0.55, alphaMin: 0.25, alphaMax: 0.5, blur: 0 },
        { sizeMin: 22, sizeMax: 38, speedMin: 0.35, speedMax: 0.7, alphaMin: 0.35, alphaMax: 0.65, blur: 1 },
      ][layer];

      hearts.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: layerCfg.sizeMin + Math.random() * (layerCfg.sizeMax - layerCfg.sizeMin),
        speed: layerCfg.speedMin + Math.random() * (layerCfg.speedMax - layerCfg.speedMin),
        alpha: layerCfg.alphaMin + Math.random() * (layerCfg.alphaMax - layerCfg.alphaMin),
        baseAlpha: 0,
        targetAlpha: layerCfg.alphaMin + Math.random() * (layerCfg.alphaMax - layerCfg.alphaMin),
        drift: (Math.random() - 0.5) * 0.3,
        wobblePhase: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.008 + Math.random() * 0.015,
        wobbleAmp: 0.3 + Math.random() * 0.5,
        rot: (Math.random() - 0.5) * 0.3,
        rotSpeed: (Math.random() - 0.5) * 0.005,
        color: hColors[Math.floor(Math.random() * hColors.length)],
        layer,
        blur: layerCfg.blur,
        parallaxFactor: [0.02, 0.05, 0.1][layer],
      });
    }

    let heartsVisible = false;
    let time = 0;

    function drawHearts() {
      ctx.clearRect(0, 0, W, H);
      time += 1;

      // Sort by layer for proper depth rendering
      hearts.sort((a, b) => a.layer - b.layer);

      for (const h of hearts) {
        // Animate alpha
        if (heartsVisible) {
          h.baseAlpha += (h.targetAlpha - h.baseAlpha) * 0.015;
        }

        // Wobble
        h.wobblePhase += h.wobbleSpeed;
        const wobbleX = Math.sin(h.wobblePhase) * h.wobbleAmp;

        // Float upward
        h.y -= h.speed;
        h.x += h.drift + wobbleX * 0.1;
        h.rot += h.rotSpeed;

        // Parallax from mouse
        const px = (mx - 0.5) * h.parallaxFactor * W;
        const py = (my - 0.5) * h.parallaxFactor * H;

        // Wrap around
        if (h.y < -h.size * 2) {
          h.y = H + h.size * 2;
          h.x = Math.random() * W;
        }
        if (h.x < -h.size * 2) h.x = W + h.size;
        if (h.x > W + h.size * 2) h.x = -h.size;

        const drawX = h.x + px;
        const drawY = h.y + py;

        ctx.save();
        ctx.globalAlpha = h.baseAlpha;
        ctx.translate(drawX, drawY);
        ctx.rotate(h.rot);

        // Glow
        ctx.shadowColor = h.color.glow;
        ctx.shadowBlur = h.size * (h.blur > 0 ? 0.6 : 0.3);

        // Fill
        heartPath(0, 0, h.size);
        const grad = ctx.createRadialGradient(-h.size * 0.15, -h.size * 0.2, 0, 0, 0, h.size * 0.8);
        grad.addColorStop(0, h.color.fill);
        grad.addColorStop(1, 'rgba(0,0,0,0.15)');
        ctx.fillStyle = grad;
        ctx.fill();

        // Highlight
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(-h.size * 0.15, -h.size * 0.25, h.size * 0.1, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${0.25 + h.layer * 0.1})`;
        ctx.fill();

        ctx.restore();
      }

      requestAnimationFrame(drawHearts);
    }
    drawHearts();

    // ============================================
    // WEB AUDIO — PROCEDURAL ROMANTIC PIANO
    // ============================================
    let audioCtx = null;
    let masterGain = null;
    let pianoPlaying = false;
    let pianoTimeout = null;
    let chordIdx = 0;
    let noteIdx = 0;

    const NOTES = {
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23,
      G4: 392.00, A4: 440.00, B4: 493.88,
      C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99,
    };

    const CHORDS = [
      [NOTES.C4, NOTES.E4, NOTES.G4, NOTES.C5, NOTES.E5],
      [NOTES.A4, NOTES.C5, NOTES.E5, NOTES.A4, NOTES.C5],
      [NOTES.F4, NOTES.A4, NOTES.C5, NOTES.F5, NOTES.A4],
      [NOTES.G4, NOTES.B4, NOTES.D5, NOTES.G5, NOTES.B4],
    ];

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.2;
      masterGain.connect(audioCtx.destination);

      // Reverb
      const delay = audioCtx.createDelay(0.5);
      delay.delayTime.value = 0.22;
      const fb = audioCtx.createGain();
      fb.gain.value = 0.25;
      const wet = audioCtx.createGain();
      wet.gain.value = 0.15;
      masterGain.connect(delay);
      delay.connect(fb);
      fb.connect(delay);
      delay.connect(wet);
      wet.connect(audioCtx.destination);
    }

    function playNote(freq, time, dur) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime + time;

      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.3, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(now);
      osc.stop(now + dur);

      // 2nd harmonic
      const osc2 = audioCtx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.value = freq * 2;
      const g2 = audioCtx.createGain();
      g2.gain.setValueAtTime(0.06, now);
      g2.gain.exponentialRampToValueAtTime(0.001, now + dur * 0.5);
      osc2.connect(g2);
      g2.connect(masterGain);
      osc2.start(now);
      osc2.stop(now + dur);
    }

    function pianoLoop() {
      if (!pianoPlaying) return;
      const chord = CHORDS[chordIdx];
      const note = chord[noteIdx];
      const isLast = noteIdx === chord.length - 1;
      playNote(note, 0, isLast ? 2.0 : 1.2);

      noteIdx++;
      if (noteIdx >= chord.length) {
        noteIdx = 0;
        chordIdx = (chordIdx + 1) % CHORDS.length;
      }

      pianoTimeout = setTimeout(pianoLoop, (isLast ? 0.9 : 0.42) * 1000);
    }

    function startPiano() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      pianoPlaying = true;
      chordIdx = 0;
      noteIdx = 0;
      // FIRST NOTE IMMEDIATELY — user gesture!
      const chord = CHORDS[0];
      playNote(chord[0], 0, 1.2);
      noteIdx = 1;
      pianoTimeout = setTimeout(pianoLoop, 420);
    }

    function stopPiano() {
      pianoPlaying = false;
      clearTimeout(pianoTimeout);
    }

    // ============================================
    // AUDIO BUTTON
    // ============================================
    const audioBtn = document.getElementById('audioBtn');

    audioBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (pianoPlaying) {
        stopPiano();
        audioBtn.classList.remove('playing');
      } else {
        startPiano();
        audioBtn.classList.add('playing');
      }
    });

    // Auto-play on first click anywhere
    let firstClick = true;
    document.addEventListener('click', () => {
      if (!firstClick || pianoPlaying) return;
      firstClick = false;
      startPiano();
      audioBtn.classList.add('playing');
    });

    // ============================================
    // GSAP LOAD SEQUENCE
    // ============================================
    const tl = gsap.timeline({ delay: 0.4 });

    // Text entrance
    tl.to('#textWrap', {
      opacity: 1, y: 0,
      duration: 1.2,
      ease: 'power3.out',
    });

    // Bonjour letters
    const mainLetters = wordMain.querySelectorAll('.letter');
    mainLetters.forEach((l, i) => {
      tl.add(() => l.classList.add('revealed'), 0.6 + i * 0.1);
    });

    // Divider line
    tl.to('#divider', { width: '120px', opacity: 1, duration: 0.8, ease: 'power2.out' }, 1.3);

    // Yousra letters
    const nameLetters = wordName.querySelectorAll('.letter');
    nameLetters.forEach((l, i) => {
      tl.add(() => l.classList.add('revealed'), 1.5 + i * 0.1);
    });

    // Hearts row
    tl.to('#heartsRow', { opacity: 1, duration: 0.6, ease: 'power2.out' }, 2.3);

    // Subtitle
    tl.to('#subtitle', { opacity: 1, duration: 0.8, ease: 'power2.out' }, 2.6);

    // Three.js hearts fade in
    tl.add(() => { heartsVisible = true; }, 1.5);

    // Audio button
    tl.to('#audioBtn', {
      opacity: 1, scale: 1,
      duration: 0.5,
      ease: 'back.out(1.7)',
    }, 2.8);
  </script>
</body>
</html>
